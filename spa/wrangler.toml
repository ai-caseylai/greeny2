name = "greeny"
compatibility_date = "2024-05-29"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "greeny-db"
database_id = "7191a23e-c43b-4962-b3fb-96818ac2d07c"

[vars]
API_KEY = ""
# JWT_SECRET intentionally removed: the JWT signing secret is read from the D1
# `settings` table (key = `jwt_secret`), never from a committed default.
#
# WB_API_KEY intentionally removed: a committed default is a publicly known
# credential. Set the real value in the Cloudflare Pages project
# (Settings → Environment variables) so `wrangler pages deploy` cannot reset it.
WORKBUDDY_API_URL = ""
WORKBUDDY_API_KEY = ""
